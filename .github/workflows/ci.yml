name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff 0 error)
        run: ruff check stableagent tests examples
      - name: Format check
        run: ruff format --check stableagent tests examples
      - name: Types (mypy)
        run: mypy
      - name: Tests + coverage
        run: pytest --cov=stableagent --cov-report=xml --cov-report=term-missing
