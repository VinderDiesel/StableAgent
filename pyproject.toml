[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stableagent"
version = "0.1.0"
description = "面向生产环境的轻量级 Agent 运行时：执行可靠性 + Context Engineering"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "anyio>=4.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["stableagent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["stableagent"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=stableagent --cov-report=term-missing"
