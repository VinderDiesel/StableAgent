[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stableagent"
version = "0.1.0"
description = "面向生产环境的轻量级 Agent 运行时：执行可靠性 + Context Engineering"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7",
    "anyio>=4.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]
server = [
    "fastapi>=0.115",
]

[tool.hatch.build.targets.wheel]
packages = ["stableagent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["stableagent"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=stableagent --cov-report=term-missing --cov-report=xml"
# 步骤 2.11 / D3、L8：真实 Docker 用例要 marker 被 -m 选中且 STABLEAGENT_DOCKER=1，两条缺一即跳过。
markers = [
  "docker: 需要真实 Docker 守护进程（同时设置 STABLEAGENT_DOCKER=1 才运行）",
  "live: 需要真实外部服务凭据（默认 CI 不跑）",
]

[tool.coverage.report]
# P7 终点：全库门槛 80%；心脏模块由 CI FOCUS 单独按 90% 把关
fail_under = 80
show_missing = true
